name: Release archive
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python scripts/check_package.py
      - name: Verify version matches tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c 'import json,os; assert os.environ["RELEASE_TAG"] == "v" + json.load(open("custom_components/marstek/manifest.json"))["version"]'
      - run: python scripts/package.py
      - name: Attach manual installation archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip --generate-notes --draft
